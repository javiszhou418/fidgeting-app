<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a0d11">
  <link rel="icon" href="data:,">
  <title>Fidgeting 模型制作</title>
  <meta name="description" content="从参考图到 Blender、Unity 和手机成品的模型制作工具。">
  <link rel="stylesheet" href="styles.css">
  <script type="importmap">
    { "imports": { "three": "/vendor/three-build/three.module.js" } }
  </script>
  <script>
    window.addEventListener("error", (event) => {
      const target = document.getElementById("current-model-title");
      if (target) target.textContent = `载入失败 · ${event.message || "模块错误"}`;
    });
    window.addEventListener("unhandledrejection", (event) => {
      const target = document.getElementById("current-model-title");
      if (target) target.textContent = `载入失败 · ${event.reason?.message || event.reason || "异步错误"}`;
    });
  </script>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">FIDGETING · MODEL</p>
        <h1 id="current-model-title">载入模型…</h1>
      </div>
    </header>

    <div class="workspace">
      <aside class="sidebar">
        <h2>模型</h2>
        <nav id="model-nav" class="model-nav" aria-label="模型列表"></nav>
      </aside>

      <main class="main-content">
        <section id="current-task-banner" class="current-task-banner" aria-live="polite"></section>
        <section class="pipeline-section" aria-labelledby="pipeline-title">
          <div class="section-heading">
            <h2 id="pipeline-title">12-Gate 制作流程</h2>
          </div>
          <div class="stage-rail" id="stage-rail"></div>
        </section>
        <nav id="workspace-tabs" class="workspace-tabs" aria-label="固定模型工作区"></nav>
        <section id="stage-detail" class="stage-detail"></section>
      </main>
    </div>
  </div>

  <dialog class="asset-dialog" id="asset-dialog">
    <div class="dialog-bar">
      <div>
        <span id="dialog-slot" class="asset-slot"></span>
        <strong id="dialog-title"></strong>
        <code id="dialog-path"></code>
      </div>
      <button type="button" class="button dialog-return" id="dialog-close" aria-label="关闭大图并返回工作台">← 返回工作台</button>
    </div>
    <div class="asset-stage" id="asset-stage"></div>
    <div class="dialog-actions">
      <button type="button" class="button button-secondary" id="annotate-button">框选问题</button>
      <a class="button button-secondary" id="open-file" target="_blank" rel="noreferrer">打开原文件</a>
      <button type="button" class="button button-primary" id="copy-path">复制路径</button>
    </div>
    <form id="issue-form" class="issue-form" hidden>
      <div class="selection-preview" id="selection-preview">请在图片上拖拽框选问题区域</div>
      <label>问题说明<textarea id="issue-note" rows="3" required placeholder="例如：中心盖比参考图大，遮住了翼片根部。"></textarea></label>
      <label>严重度<select id="issue-severity"><option value="warning">警告</option><option value="blocker">阻断</option><option value="note">备注</option></select></label>
      <label>关联分析项<select id="issue-claim"><option value="">不关联</option></select></label>
      <button type="submit" class="button button-primary">保存问题</button>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
