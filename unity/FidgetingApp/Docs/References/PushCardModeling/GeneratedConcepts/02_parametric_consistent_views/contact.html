<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>Push-card six canonical views</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; min-height: 100%; background: #12171b; font-family: Inter, "PingFang SC", system-ui, sans-serif; }
    body { padding: 24px; }
    header { height: 68px; display: flex; justify-content: space-between; align-items: center; color: #eef2f4; }
    h1 { margin: 0; font-size: 28px; letter-spacing: .035em; }
    p { margin: 5px 0 0; color: #9ea9b0; font-size: 13px; letter-spacing: .08em; }
    .mark { color: #f37a30; font: 700 14px/1 ui-monospace, monospace; }
    main { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    figure { margin: 0; border: 1px solid #465159; background: #e8ebed; overflow: hidden; }
    img { width: 100%; height: auto; display: block; }
  </style>
</head>
<body>
  <header>
    <div><h1>磁吸推牌｜同源六视图最终校正版</h1><p>同一 7 层几何 · M1–M6 单行 X 轴 · 左右端面严格相反 · 顶视与爆炸同源</p></div>
    <span class="mark">CANONICAL / V2 FINAL</span>
  </header>
  <main>
    <figure><img src="./01_exploded.png" alt="exploded"></figure>
    <figure><img src="./02_top.png" alt="top"></figure>
    <figure><img src="./03_front.png" alt="front"></figure>
    <figure><img src="./04_back_underside.png" alt="back"></figure>
    <figure><img src="./05_left_end.png" alt="left"></figure>
    <figure><img src="./06_right_end.png" alt="right"></figure>
  </main>
</body>
</html>
