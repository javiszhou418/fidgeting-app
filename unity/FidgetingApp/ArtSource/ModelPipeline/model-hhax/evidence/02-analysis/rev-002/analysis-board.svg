  <g font-family="Arial,sans-serif">
    <text x="650" y="246" fill="#f4eef8" font-size="31" font-weight="700">确认</text>
    <g fill="#d2cbd8" font-size="25">
      <text x="650" y="302">01  闭合外廓 50.5 × 30.9 × 13.6 mm</text>
      <text x="650" y="350">02  长轴直推 + 机械旋转联动轨道</text>
      <text x="650" y="398">03  磁铁只固定可换贴片，不驱动动作</text>
      <text x="650" y="446">04  两个胶囊主壳；下方露出的是下壳尾部</text>
