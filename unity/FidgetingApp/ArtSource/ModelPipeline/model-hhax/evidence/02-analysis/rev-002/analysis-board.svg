    </g>
    <text x="650" y="582" fill="#f4eef8" font-size="31" font-weight="700">定制材质</text>
    <g fill="#d2cbd8" font-size="25">
      <text x="650" y="638">近黑紫灰高抛金属 · 仅窄边局部虹彩</text>
