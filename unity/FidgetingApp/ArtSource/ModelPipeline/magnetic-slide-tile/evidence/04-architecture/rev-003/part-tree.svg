<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071017"/><stop offset="1" stop-color="#121a23"/></linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f1f6f7"/><stop offset=".32" stop-color="#697a85"/><stop offset=".67" stop-color="#dce6e9"/><stop offset="1" stop-color="#778893"/></linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#75e8ee" stop-opacity=".8"/><stop offset=".52" stop-color="#776de8" stop-opacity=".72"/><stop offset="1" stop-color="#ee78bd" stop-opacity=".72"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#70e8ee"/></marker>
    <clipPath id="photo"><rect x="65" y="188" width="440" height="765" rx="28"/></clipPath>
    <style>
      .sans{font-family:Inter,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.eye{font-size:18px;font-weight:800;letter-spacing:.15em;fill:#70e8ee}.title{font-size:50px;font-weight:850;fill:#f4f8fa}.sub{font-size:21px;fill:#a8b4bd}.h2{font-size:27px;font-weight:850;fill:#f4f8fa}.body{font-size:19px;fill:#aebac3}.small{font-size:16px;fill:#96a5af}.chip{font-size:17px;font-weight:800;fill:#081116}.label{font-size:18px;font-weight:800;fill:#f4f8fa}.node{fill:#111c24;stroke:#334652;stroke-width:2}.cyan{fill:none;stroke:#70e8ee;stroke-width:5}.dash{fill:none;stroke:#667985;stroke-width:3;stroke-dasharray:10 9}.leader{fill:none;stroke:#70e8ee;stroke-width:4;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="1100" fill="url(#bg)"/>
  <text x="65" y="73" class="sans eye">GATE 04 · TWO-PART ARCHITECTURE · REV 03</text>
  <text x="65" y="137" class="sans title">磁吸推牌 · 只有两个实体零件</text>
  <text x="865" y="120" class="sans sub">装饰面、双通道与圆形旋转轨都属于本体几何，不再拆成额外零件</text>

  <rect x="65" y="188" width="440" height="765" rx="28" fill="#05080b" stroke="#334652" stroke-width="2"/>
  <image href="../../01-intake/rev-001/user-video-frames/frame-08.jpg" x="65" y="188" width="440" height="765" preserveAspectRatio="xMidYMid slice" clip-path="url(#photo)"/>
  <rect x="88" y="211" width="140" height="42" rx="21" fill="#071018" stroke="#70e8ee"/><text x="113" y="239" class="sans label">你的实拍</text>
  <path d="M185 480C115 425 126 345 175 305" class="leader"/>
  <rect x="91" y="266" width="270" height="58" rx="15" fill="#071018" fill-opacity=".93" stroke="#70e8ee"/><text x="118" y="303" class="sans label">上片背面的双通道</text>
  <rect x="88" y="855" width="384" height="72" rx="18" fill="#071018" fill-opacity=".93" stroke="#70e8ee"/>
  <text x="111" y="885" class="sans label">实拍只证明可见区域</text><text x="111" y="913" class="sans small">轨道截面、磁体与滚珠数量仍不猜</text>

  <rect x="555" y="188" width="975" height="116" rx="25" fill="#13232b" stroke="#70e8ee" stroke-width="3"/>
  <text x="594" y="234" class="sans h2">装配根节点 · 2 Parts · 50 × 31 × 12 mm</text>
  <text x="594" y="274" class="sans body">闭合中心为原点；下片固定，上片先纵向直推 21 mm；到达末端之后才开放约 90° 旋转</text>

  <rect x="555" y="337" width="975" height="250" rx="26" class="node"/>
  <rect x="586" y="365" width="206" height="38" rx="19" fill="url(#face)"/><text x="615" y="391" class="sans chip">01 · 运动上片</text>
  <text x="586" y="448" class="sans h2">UpperBody_Moving</text>
  <text x="586" y="486" class="sans body">正面花纹 = 上片表面；不是独立嵌片</text>
  <text x="586" y="521" class="sans body">背面直接加工两条纵向滑轨 / 槽</text>
  <g transform="translate(1110 370)">
    <rect x="0" y="0" width="340" height="170" rx="82" fill="url(#metal)" stroke="#dfe9eb" stroke-width="3"/>
    <rect x="24" y="20" width="292" height="130" rx="64" fill="#18232b"/>
    <path d="M125 38V132" class="cyan" stroke-linecap="round"/><path d="M215 38V132" class="cyan" stroke-linecap="round"/>
    <text x="71" y="164" class="sans small">背面：双通道集成在上片本体</text>
  </g>

  <rect x="555" y="620" width="975" height="252" rx="26" class="node"/>
  <rect x="586" y="648" width="206" height="38" rx="19" fill="url(#metal)"/><text x="615" y="674" class="sans chip">02 · 固定下片</text>
  <text x="586" y="731" class="sans h2">LowerBody_Fixed</text>
  <text x="586" y="769" class="sans body">背面装饰 = 下片表面；不是独立嵌片</text>
  <text x="586" y="804" class="sans body">本体内部集成圆形旋转滑轨</text>
  <g transform="translate(1110 652)">
    <rect x="0" y="0" width="340" height="170" rx="82" fill="url(#metal)" stroke="#dfe9eb" stroke-width="3"/>
    <rect x="24" y="20" width="292" height="130" rx="64" fill="#18232b"/>
    <path d="M175 38A48 48 0 1 1 137 56" fill="none" stroke="#70e8ee" stroke-width="14" stroke-linecap="round"/>
    <circle cx="137" cy="56" r="7" fill="#f4f8fa"/><circle cx="175" cy="38" r="7" fill="#f4f8fa"/>
    <text x="69" y="164" class="sans small">内侧：圆形旋转轨集成在下片</text>
  </g>

  <path d="M795 587V620" class="dash"/><rect x="704" y="575" width="420" height="55" rx="16" fill="#0a141b" stroke="#d8a75e" stroke-width="2"/>
  <text x="730" y="610" class="sans label">接口是两片本体上的轨道几何，不是第三个零件</text>

  <rect x="555" y="905" width="975" height="118" rx="24" fill="#101b22" stroke="#334652" stroke-width="2"/>
  <text x="586" y="945" class="sans label">唯一允许的运动顺序</text>
  <rect x="586" y="964" width="190" height="40" rx="20" fill="#1b2a33"/><text x="625" y="991" class="sans small">① 闭合锁定</text>
  <path d="M790 984H850" class="leader"/>
  <rect x="866" y="964" width="245" height="40" rx="20" fill="#1b2a33"/><text x="899" y="991" class="sans small">② 纵向推到末端</text>
  <path d="M1125 984H1185" class="leader"/>
  <rect x="1201" y="964" width="286" height="40" rx="20" fill="#1b2a33"/><text x="1237" y="991" class="sans small">③ 末端解锁旋转 ≤90°</text>
  <text x="65" y="1064" class="sans small">本图替代被否决的五层方案；Gate 05 Blender 对象只能是 UpperBody_Moving 与 LowerBody_Fixed 两个实体。</text>
</svg>
