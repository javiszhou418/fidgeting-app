  <rect x="625" y="575" width="880" height="315" rx="28" fill="#101a22" stroke="#d8a75e" stroke-width="2"/>
  <text x="660" y="624" class="sans eye">KNOWN FROM THE IMAGE</text>
  <text x="660" y="669" class="sans body">A circular ball region and multiple central-hub shapes are visible in the exact-product overview.</text>
  <text x="660" y="710" class="sans eye">NOT KNOWN</text>
  <text x="660" y="755" class="sans body">Which hub is fixed, which rotates, bearing stack, axle attachment, shared parts, mode coupling.</text>
  <text x="660" y="806" class="sans eye">ONE REQUIRED ANSWER</text>
  <text x="660" y="851" class="sans h2">During free spin, which visible part stays fixed and which visible part turns with the upper face?</text>

  <rect x="65" y="928" width="1440" height="92" rx="22" fill="#11161d" stroke="#344752"/>
  <text x="95" y="965" class="sans label">If the crops do not show the answer:</text>
  <text x="95" y="997" class="sans body">Provide one close photo of the center interface with the upper face lifted or separated from the base.</text>
  <text x="65" y="1064" class="sans small">Source: immutable HALOOPLAYER official asset 07. No rev 6 circular-track construction or coupling is reused.</text>
