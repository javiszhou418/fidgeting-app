  <text x="65" y="70" class="sans eye">GATE 04 / EXACT-SOURCE QUESTION / REV 07</text>
  <text x="65" y="132" class="sans title">Rotary construction is not determined</text>
  <text x="65" y="170" class="sans sub">The source shows a circular ball region and central hubs. It does not prove fixed/rotating ownership or coupling.</text>

