  <text x="65" y="70" class="sans eye">GATE 04 / EXACT-SOURCE QUESTION / REV 07</text>
  <text x="65" y="132" class="sans title">Straight-slider construction is not determined</text>
  <text x="65" y="170" class="sans sub">The source shows long-groove parts. It does not prove ownership, engagement, or which body moves.</text>

