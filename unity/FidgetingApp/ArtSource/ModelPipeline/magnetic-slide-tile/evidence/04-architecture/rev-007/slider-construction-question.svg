  <text x="660" y="624" class="sans eye">KNOWN FROM THE IMAGE</text>
  <text x="660" y="669" class="sans body">Two separate long-groove components are visible in the official product overview.</text>
  <text x="660" y="710" class="sans eye">NOT KNOWN</text>
  <text x="660" y="755" class="sans body">Moving/fixed ownership, mating orientation, rail cross-section, engagement path, hidden count.</text>
  <text x="660" y="806" class="sans eye">ONE REQUIRED ANSWER</text>
  <text x="660" y="851" class="sans h2">Which visible part is attached to the moving face, and which is attached to the fixed body?</text>

  <rect x="65" y="928" width="1440" height="92" rx="22" fill="#11161d" stroke="#344752"/>
  <text x="95" y="965" class="sans label">If neither crop matches your unit:</text>
  <text x="95" y="997" class="sans body">Provide one fully-open photo with the rear of the moving face and the fixed base visible in the same frame.</text>
  <text x="65" y="1064" class="sans small">Source: immutable HALOOPLAYER official asset 07. No rev 6 rail geometry or replacement architecture is reused.</text>
