      <g><circle class="tag" cx="448" cy="76" r="18"/><text class="num" x="448" y="76">H1</text></g>
      <g><circle class="tag" cx="278" cy="258" r="18"/><text class="num" x="278" y="258">H2</text></g>
      <g><circle class="tag" cx="674" cy="272" r="18"/><text class="num" x="674" y="272">H3</text></g>
