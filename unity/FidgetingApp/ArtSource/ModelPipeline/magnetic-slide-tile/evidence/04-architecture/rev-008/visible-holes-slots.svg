      <text class="num" x="394" y="290">S1</text><text class="num" x="481" y="300">S2</text>
    </svg>
  </g>

  <g transform="translate(710 112)">
    <rect width="662" height="560" rx="16" class="panel"/>
    <text x="20" y="34" class="head">活动槽板 B · 用户确认“可运动”</text>
    <svg x="20" y="50" width="622" height="493" viewBox="0 0 720 643">
      <image href="source-crops/official-slider-b.png" width="720" height="643"/>
      <path class="slot" d="M239 269 L565 439"/><path class="slot" d="M194 324 L523 497"/>
      <path class="slot" d="M326 219 Q448 281 574 347"/><path class="slot" d="M246 385 Q365 447 483 508"/>
      <circle class="hole" cx="382" cy="197" r="22"/><circle class="hole" cx="552" cy="263" r="22"/><circle class="hole" cx="209" cy="419" r="22"/><circle class="hole" cx="408" cy="530" r="22"/>
