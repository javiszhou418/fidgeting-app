      <circle class="hole" cx="287" cy="277" r="60"/>
      <circle class="contact" cx="127" cy="128" r="28"/><circle class="contact" cx="267" cy="111" r="30"/>
      <circle class="contact" cx="108" cy="229" r="31"/><circle class="contact" cx="431" cy="270" r="31"/>
      <circle class="contact" cx="302" cy="389" r="31"/><circle class="contact" cx="457" cy="411" r="28"/>
      <g><circle class="tag" cx="287" cy="203" r="20"/><text class="num" x="287" y="203">P2</text></g>
      <g><circle class="tag" cx="85" cy="90" r="18"/><text class="num" x="85" y="90">C1</text></g>
      <g><circle class="tag" cx="267" cy="67" r="18"/><text class="num" x="267" y="67">C2</text></g>
      <g><circle class="tag" cx="62" cy="230" r="18"/><text class="num" x="62" y="230">C3</text></g>
      <g><circle class="tag" cx="482" cy="269" r="18"/><text class="num" x="482" y="269">C4</text></g>
      <g><circle class="tag" cx="302" cy="439" r="18"/><text class="num" x="302" y="439">C5</text></g>
