  <g transform="translate(710 692)">
    <rect width="662" height="560" rx="16" class="panel"/>
    <text x="20" y="34" class="head">下层承载区 · 中央接口与可见接触件</text>
    <svg x="20" y="50" width="622" height="493" viewBox="0 0 700 737">
      <image href="source-crops/official-fixed-carrier.png" width="700" height="737"/>
      <circle class="hole" cx="390" cy="235" r="64"/>
      <circle class="contact" cx="323" cy="170" r="29"/><circle class="contact" cx="417" cy="132" r="29"/>
      <circle class="contact" cx="449" cy="174" r="29"/><circle class="contact" cx="500" cy="182" r="26"/>
      <circle class="contact" cx="283" cy="326" r="27"/><circle class="contact" cx="335" cy="330" r="28"/>
      <circle class="contact" cx="377" cy="360" r="28"/><circle class="contact" cx="493" cy="317" r="28"/>
      <g><circle class="tag" cx="390" cy="235" r="22"/><text class="num" x="390" y="235">P1</text></g>
      <path class="unknown" d="M243 389 Q390 454 528 369"/>
    </svg>
    <text x="24" y="536" class="note">虚线以下被外壳 / 图案遮挡；不补画背面孔槽或连接方式。</text>
  </g>
  <text x="36" y="1292" class="note">未声明：孔深、公差、不可见数量、磁极、A/B 与上盖的隐藏紧固方式、或直推与旋转接口的内部耦合。</text>
</svg>
