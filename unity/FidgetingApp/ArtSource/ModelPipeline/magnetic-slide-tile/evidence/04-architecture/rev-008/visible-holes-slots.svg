<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1320" viewBox="0 0 1400 1320">
  <defs>
    <style>
      .title{font:800 34px -apple-system,"PingFang SC",sans-serif;fill:#f5f7f8}.sub{font:500 18px -apple-system,"PingFang SC",sans-serif;fill:#aab2b8}
      .panel{fill:#0a0d10;stroke:#303840;stroke-width:2}.head{font:800 20px -apple-system,"PingFang SC",sans-serif;fill:#f5f7f8}
      .slot{fill:none;stroke:#62d9ff;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}.hole{fill:none;stroke:#ffcf68;stroke-width:6}.contact{fill:none;stroke:#ff8ab1;stroke-width:5}
      .tag{fill:#071016;stroke:#62d9ff;stroke-width:2}.num{font:800 15px -apple-system,"PingFang SC",sans-serif;fill:#f5f7f8;text-anchor:middle;dominant-baseline:middle}
      .note{font:550 15px -apple-system,"PingFang SC",sans-serif;fill:#c1c8cd}.unknown{fill:none;stroke:#9ba5ad;stroke-width:5;stroke-dasharray:10 9}
    </style>
  </defs>
  <rect width="1400" height="1320" fill="#080a0c"/>
  <text x="36" y="52" class="title">可见孔、槽与接触区：只沿可见边缘描线</text>
  <text x="36" y="84" class="sub">蓝 = 槽 / 珠道边界；黄 = 开口 / 孔候选；粉 = 可见接触件。编号只用于本次确认，不代表隐藏数量或孔深。</text>

  <g transform="translate(28 112)">
