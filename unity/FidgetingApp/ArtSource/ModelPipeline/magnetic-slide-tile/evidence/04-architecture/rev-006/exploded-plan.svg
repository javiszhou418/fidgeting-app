<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071017"/><stop offset="1" stop-color="#151925"/></linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f3f7f8"/><stop offset=".3" stop-color="#687983"/><stop offset=".64" stop-color="#dbe5e8"/><stop offset="1" stop-color="#758691"/></linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#70e8ee" stop-opacity=".86"/><stop offset=".52" stop-color="#786ee8" stop-opacity=".78"/><stop offset="1" stop-color="#ef79be" stop-opacity=".78"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#70e8ee"/></marker>
    <clipPath id="photoPush"><rect x="1195" y="205" width="335" height="300" rx="24"/></clipPath>
    <clipPath id="photoSpin"><rect x="1195" y="548" width="335" height="300" rx="24"/></clipPath>
    <style>
      .sans{font-family:Inter,Arial,sans-serif}.eye{font-size:18px;font-weight:800;letter-spacing:.15em;fill:#70e8ee}.title{font-size:50px;font-weight:850;fill:#f4f8fa}.sub{font-size:20px;fill:#aab6bf}.h2{font-size:25px;font-weight:850;fill:#f4f8fa}.body{font-size:18px;fill:#acb8c1}.small{font-size:15px;fill:#93a3ad}.label{font-size:17px;font-weight:800;fill:#f4f8fa}.leader{fill:none;stroke:#70e8ee;stroke-width:4;marker-end:url(#arrow)}.dash{fill:none;stroke:#657985;stroke-width:3;stroke-dasharray:11 9}
    </style>
