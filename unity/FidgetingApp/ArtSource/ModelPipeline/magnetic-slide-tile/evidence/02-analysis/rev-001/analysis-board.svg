<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1550" viewBox="0 0 1920 1550">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#141b2e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity=".35"/>
    </filter>
    <clipPath id="p1"><rect x="60" y="220" width="420" height="500" rx="22"/></clipPath>
    <clipPath id="p2"><rect x="520" y="220" width="420" height="500" rx="22"/></clipPath>
    <clipPath id="p3"><rect x="980" y="220" width="420" height="500" rx="22"/></clipPath>
    <clipPath id="p4"><rect x="1440" y="220" width="420" height="500" rx="22"/></clipPath>
    <style>
      .sans{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif}
      .title{font-size:52px;font-weight:760;fill:#f8fafc}.sub{font-size:24px;fill:#a8b3cf}
      .panel-title{font-size:25px;font-weight:720;fill:#f8fafc}.meta{font-size:18px;fill:#98a6c5}
      .card-title{font-size:29px;font-weight:760}.body{font-size:21px;fill:#d9e1f2}.small{font-size:18px;fill:#aebbd4}
      .num{font-size:22px;font-weight:800;fill:#07101d;text-anchor:middle;dominant-baseline:central}
    </style>
  </defs>
  <rect width="1920" height="1550" fill="url(#bg)"/>
  <text x="60" y="78" class="sans title">Gate 02 · 参考分析板</text>
  <text x="60" y="122" class="sans sub">磁吸推牌 / 同款不同定制外观 · 只确定“证据支持到哪里”，此阶段不建模、不锁毫米尺寸</text>
  <g transform="translate(60 154)">
    <rect width="138" height="42" rx="21" fill="#39d6c4"/><text x="69" y="22" class="sans num">直接观察</text>
    <rect x="158" width="138" height="42" rx="21" fill="#f6c85f"/><text x="227" y="22" class="sans num">交叉推断</text>
    <rect x="316" width="138" height="42" rx="21" fill="#ff7b8b"/><text x="385" y="22" class="sans num">仍然未知</text>
  </g>

  <g filter="url(#shadow)"><rect x="60" y="220" width="420" height="500" rx="22" fill="#202a40"/><image href="../../01-intake/rev-001/user-video-frames/frame-03.jpg" x="60" y="220" width="420" height="500" preserveAspectRatio="xMidYMid slice" clip-path="url(#p1)"/></g>
  <rect x="60" y="634" width="420" height="86" fill="#0b1020" opacity=".88"/><text x="82" y="670" class="sans panel-title">① 侧面厚度 / 分层</text><text x="82" y="700" class="sans meta">用户视频 12.5 s · 第一手证据</text>
  <circle cx="340" cy="550" r="24" fill="#39d6c4"/><text x="340" y="550" class="sans num">1</text>

  <g filter="url(#shadow)"><rect x="520" y="220" width="420" height="500" rx="22" fill="#202a40"/><image href="../../01-intake/rev-001/user-video-frames/frame-08.jpg" x="520" y="220" width="420" height="500" preserveAspectRatio="xMidYMid slice" clip-path="url(#p2)"/></g>
  <rect x="520" y="634" width="420" height="86" fill="#0b1020" opacity=".88"/><text x="542" y="670" class="sans panel-title">② 半开状态 / 内部局部</text><text x="542" y="700" class="sans meta">用户视频 43.75 s · 第一手证据</text>
  <circle cx="708" cy="400" r="24" fill="#39d6c4"/><text x="708" y="400" class="sans num">2</text>

  <g filter="url(#shadow)"><rect x="980" y="220" width="420" height="500" rx="22" fill="#202a40"/><image href="../../01-intake/rev-002/external-nxedc/reference-04.jpg" x="980" y="220" width="420" height="500" preserveAspectRatio="xMidYMid slice" clip-path="url(#p3)"/></g>
  <rect x="980" y="634" width="420" height="86" fill="#0b1020" opacity=".88"/><text x="1002" y="670" class="sans panel-title">③ 双通道候选细节</text><text x="1002" y="700" class="sans meta">NXEDC 候选 · 外部交叉证据</text>
  <circle cx="1240" cy="404" r="24" fill="#f6c85f"/><text x="1240" y="404" class="sans num">3</text>

  <g filter="url(#shadow)"><rect x="1440" y="220" width="420" height="500" rx="22" fill="#202a40"/><image href="../../01-intake/rev-001/obsidian-frames/frame-10.jpg" x="1440" y="220" width="420" height="500" preserveAspectRatio="xMidYMid slice" clip-path="url(#p4)"/></g>
  <rect x="1440" y="634" width="420" height="86" fill="#0b1020" opacity=".88"/><text x="1462" y="670" class="sans panel-title">④ 同款 / 另一定制外观</text><text x="1462" y="700" class="sans meta">Obsidian/Douyin · 用户指定参考</text>
  <circle cx="1620" cy="520" r="24" fill="#39d6c4"/><text x="1620" y="520" class="sans num">4</text>

  <g transform="translate(60 765)">
    <rect width="570" height="540" rx="26" fill="#111c2c" stroke="#39d6c4" stroke-width="3"/>
    <text x="30" y="58" class="sans card-title" fill="#39d6c4">可直接作为建模依据</text>
    <text x="30" y="104" class="sans body"><tspan x="30">• 外轮廓是纵向胶囊形：上下圆弧、</tspan><tspan x="50" dy="31">中段近直边。</tspan></text>
    <text x="30" y="184" class="sans body"><tspan x="30">• 至少有上下两个主要移动/承载件，</tspan><tspan x="50" dy="31">闭合时同轮廓叠放，侧面有连续窄缝。</tspan></text>
    <text x="30" y="264" class="sans body"><tspan x="30">• 主动作沿长轴推出；完全打开时，</tspan><tspan x="50" dy="31">上片仍与下片保持连接。</tspan></text>
    <text x="30" y="344" class="sans body"><tspan x="30">• 边框呈镜面/高抛光金属观感；</tspan><tspan x="50" dy="31">装饰图案是可变化的表皮，不是主体轮廓。</tspan></text>
    <text x="30" y="424" class="sans body"><tspan x="30">• 用户视频记录到离散机械敲击声，</tspan><tspan x="50" dy="31">可用于后续验证节拍与高低音差异。</tspan></text>
    <text x="30" y="504" class="sans small">证据等级：高 · 来源以用户视频为主</text>
  </g>

  <g transform="translate(675 765)">
    <rect width="570" height="540" rx="26" fill="#211d19" stroke="#f6c85f" stroke-width="3"/>
    <text x="30" y="58" class="sans card-title" fill="#f6c85f">需要你判断是否接受的推断</text>
    <text x="30" y="104" class="sans body"><tspan x="30">• 内部为两条纵向工作通道；可见圆点/</tspan><tspan x="50" dy="31">珠状件，但其功能和完整数量尚未证明。</tspan></text>
    <text x="30" y="184" class="sans body"><tspan x="30">• 除直线推出外，末段可能允许小角度</tspan><tspan x="50" dy="31">偏转/旋转；轴心与角度仍待验证。</tspan></text>
    <text x="30" y="264" class="sans body"><tspan x="30">• 外部候选名称为 HALOO PLAYER</tspan><tspan x="50" dy="31">“Chrome Hearts / 克罗心律动”。</tspan></text>
    <text x="30" y="344" class="sans body"><tspan x="30">• “高低音”可能由左右错位轨道产生，</tspan><tspan x="50" dy="31">但声音—零件映射尚未拆机核验。</tspan></text>
    <text x="30" y="424" class="sans body"><tspan x="30">• 表面可能是透明树脂/晶体封层与</tspan><tspan x="50" dy="31">装饰嵌片组合，精确材质待确认。</tspan></text>
    <text x="30" y="504" class="sans small">证据等级：中 · 必须由你批准后才进入 Gate 03</text>
  </g>

  <g transform="translate(1290 765)">
    <rect width="570" height="540" rx="26" fill="#24191f" stroke="#ff7b8b" stroke-width="3"/>
    <text x="30" y="58" class="sans card-title" fill="#ff7b8b">现在禁止猜测的项目</text>
    <text x="30" y="104" class="sans body"><tspan x="30">• 闭合长度、宽度、总厚度的毫米值</tspan><tspan x="50" dy="31">（手掌和鼠标只能作尺度参考）。</tspan></text>
    <text x="30" y="184" class="sans body"><tspan x="30">• 磁铁、弹簧、滚珠、螺丝的确切数量、</tspan><tspan x="50" dy="31">尺寸、极性、孔深与公差。</tspan></text>
    <text x="30" y="264" class="sans body"><tspan x="30">• 导轨截面、隐藏扣件、止挡、轴心、</tspan><tspan x="50" dy="31">开合行程与最大偏转角。</tspan></text>
    <text x="30" y="344" class="sans body"><tspan x="30">• 金属牌号、镀层、透明层材料和</tspan><tspan x="50" dy="31">真实粗糙度/折射参数。</tspan></text>
    <text x="30" y="424" class="sans body"><tspan x="30">• 外部商品页的品牌和宣传文字是否</tspan><tspan x="50" dy="31">完全适用于你手里的定制版本。</tspan></text>
    <text x="30" y="504" class="sans small">这些未知项会在 Gate 03 形成尺寸/结构待确认清单</text>
  </g>

  <rect x="60" y="1345" width="1800" height="145" rx="24" fill="#17243a" stroke="#435372" stroke-width="2"/>
  <text x="90" y="1395" class="sans card-title" fill="#f8fafc">你在第二关只需要做什么？</text>
  <text x="90" y="1438" class="sans body">逐条看黄色“推断”：接受、指出错误，或在对应图片上框选问题。蓝色观察若也不对，同样可以驳回。</text>
  <text x="90" y="1472" class="sans small">批准 Gate 02 ＝只批准“我们理解对了”，不等于批准尺寸、白模、材质或最终模型；下一关才共同锁建模合同。</text>
</svg>
