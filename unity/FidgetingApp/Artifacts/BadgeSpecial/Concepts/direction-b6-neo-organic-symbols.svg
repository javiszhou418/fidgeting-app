<svg xmlns="http://www.w3.org/2000/svg" width="1254" height="1254" viewBox="0 0 1254 1254">
  <defs>
    <style>
      @font-face { font-family: Oxanium; src: url('../../../Assets/Plugins/iOS/Fonts/Oxanium-VariableFont_wght.ttf'); }
      .token { font-family: Oxanium, -apple-system, sans-serif; font-size: 58px; font-weight: 720; text-anchor: middle; fill: #f2f0ed; }
      .wordToken { font-family: Oxanium, -apple-system, sans-serif; font-size: 38px; font-weight: 720; text-anchor: middle; fill: #f2f0ed; }
      .unit { font-family: Oxanium, -apple-system, sans-serif; font-size: 18px; font-weight: 650; text-anchor: middle; fill: #9d9aa2; }
      .label { font-family: Oxanium, -apple-system, sans-serif; font-weight: 680; text-anchor: middle; fill: #efeeeb; }
      .meta { font-family: -apple-system, sans-serif; font-weight: 500; text-anchor: middle; fill: #918e96; }
      .glyph { color: #e8e6e2; filter: url(#symbolBloom); }
      .glyphWarm { color: #ebe6dc; filter: url(#symbolBloom); }
    </style>

    <linearGradient id="board" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#08090c"/><stop offset="1" stop-color="#111116"/></linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f1f0ee"/><stop offset=".36" stop-color="#9b99a0"/><stop offset=".64" stop-color="#4a4950"/><stop offset="1" stop-color="#cac8cc"/></linearGradient>
    <radialGradient id="well"><stop stop-color="#24232a"/><stop offset=".58" stop-color="#17171d"/><stop offset="1" stop-color="#0d0e12"/></radialGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><path d="M0 1.5h4" stroke="#fff" stroke-opacity=".018" stroke-width="1"/></pattern>
    <filter id="cardShadow" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="13" stdDeviation="15" flood-color="#000" flood-opacity=".64"/></filter>
    <filter id="symbolBloom" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="7" result="blur"/>
      <feFlood flood-color="#f0ecff" flood-opacity=".22" result="light"/>
      <feComposite in="light" in2="blur" operator="in" result="halo"/>
      <feMerge><feMergeNode in="halo"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- PULSE: four repeated soft impulses around a stable center. -->
    <g id="pulseGlyph" fill="currentColor">
      <path d="M140 88c8-22 23-34 45-32-7 21-22 32-45 32z"/>
      <path d="M140 88c8-22 23-34 45-32-7 21-22 32-45 32z" transform="rotate(90 140 88)"/>
      <path d="M140 88c8-22 23-34 45-32-7 21-22 32-45 32z" transform="rotate(180 140 88)"/>
      <path d="M140 88c8-22 23-34 45-32-7 21-22 32-45 32z" transform="rotate(270 140 88)"/>
    </g>

    <!-- COMBO: two complete loop silhouettes, fused without arbitrary connector pieces. -->
    <g id="comboGlyph" fill="currentColor" fill-rule="evenodd">
      <path d="M93 57h35a31 31 0 0 1 0 62H93a31 31 0 0 1 0-62zm0 18a13 13 0 0 0 0 26h35a13 13 0 0 0 0-26z"/>
      <path d="M152 57h35a31 31 0 0 1 0 62h-35a31 31 0 0 1 0-62zm0 18a13 13 0 0 0 0 26h35a13 13 0 0 0 0-26z"/>
    </g>

    <!-- SPEED: three tapered motion plates cross a pair of orbital traces. -->
    <g id="speedGlyph" fill="currentColor">
      <ellipse cx="140" cy="99" rx="61" ry="18" fill="none" stroke="currentColor" stroke-width="2.5"/>
      <ellipse cx="140" cy="99" rx="51" ry="13" fill="none" stroke="currentColor" stroke-width="1.5" opacity=".72"/>
      <path d="M88 55c15 18 28 33 43 50l-13 23c-16-20-29-35-46-53z"/>
      <path d="M116 50c15 18 28 33 43 50l-13 23c-16-20-29-35-46-53z"/>
      <path d="M144 53c15 18 28 33 43 50l-13 23c-16-20-29-35-46-53z"/>
    </g>

    <!-- FOCUS: four soft brackets converge while preserving a calm center. -->
    <g id="focusGlyph" fill="currentColor">
      <path d="M91 88c0-26 15-40 41-40v19c-14 0-22 8-22 21z"/>
      <path d="M91 88c0-26 15-40 41-40v19c-14 0-22 8-22 21z" transform="rotate(90 140 88)"/>
      <path d="M91 88c0-26 15-40 41-40v19c-14 0-22 8-22 21z" transform="rotate(180 140 88)"/>
      <path d="M91 88c0-26 15-40 41-40v19c-14 0-22 8-22 21z" transform="rotate(270 140 88)"/>
      <circle cx="140" cy="88" r="9"/>
    </g>

    <!-- PERFECT: four aligned flares create an exact negative-space cross. -->
    <g id="perfectGlyph" fill="currentColor">
      <path d="M140 88c15-8 25-20 43-42-7 24-7 34 7 42-14-2-27-2-50 0z"/>
      <path d="M140 88c15-8 25-20 43-42-7 24-7 34 7 42-14-2-27-2-50 0z" transform="rotate(90 140 88)"/>
      <path d="M140 88c15-8 25-20 43-42-7 24-7 34 7 42-14-2-27-2-50 0z" transform="rotate(180 140 88)"/>
      <path d="M140 88c15-8 25-20 43-42-7 24-7 34 7 42-14-2-27-2-50 0z" transform="rotate(270 140 88)"/>
    </g>

    <!-- RHYTHM: a wavy modular lattice around one breathing negative core. -->
    <path id="rhythmGlyph" fill="currentColor" fill-rule="evenodd" d="M101 52c12-7 22-2 31 12 6 10 10 10 16 0 9-14 19-19 31-12 11 7 6 20-7 30-10 8-10 12 0 20 13 10 18 23 7 30-12 7-22 2-31-12-6-10-10-10-16 0-9 14-19 19-31 12-11-7-6-20 7-30 10-8 10-12 0-20-13-10-18-23-7-30zm39 22c-9 0-16 6-16 14s7 14 16 14 16-6 16-14-7-14-16-14z"/>

    <!-- MASTERY: three broad completion currents lock into one stable aperture. -->
    <g id="masteryGlyph" fill="currentColor">
      <path d="M140 88c8-25 27-39 49-32-9 20-25 31-49 32 13 1 25 8 32 20-17 4-28-4-32-20z"/>
      <path d="M140 88c8-25 27-39 49-32-9 20-25 31-49 32 13 1 25 8 32 20-17 4-28-4-32-20z" transform="rotate(120 140 88)"/>
      <path d="M140 88c8-25 27-39 49-32-9 20-25 31-49 32 13 1 25 8 32 20-17 4-28-4-32-20z" transform="rotate(240 140 88)"/>
      <circle cx="140" cy="88" r="12" fill="#141419"/>
    </g>

    <!-- COLLECTION: six card-like shutters form a controlled archive aperture. -->
    <g id="collectionGlyph" fill="currentColor">
      <path d="M140 88c12-21 28-31 47-29l-14 21c-10 5-20 8-33 8z"/>
      <path d="M140 88c12-21 28-31 47-29l-14 21c-10 5-20 8-33 8z" transform="rotate(60 140 88)"/>
      <path d="M140 88c12-21 28-31 47-29l-14 21c-10 5-20 8-33 8z" transform="rotate(120 140 88)"/>
      <path d="M140 88c12-21 28-31 47-29l-14 21c-10 5-20 8-33 8z" transform="rotate(180 140 88)"/>
      <path d="M140 88c12-21 28-31 47-29l-14 21c-10 5-20 8-33 8z" transform="rotate(240 140 88)"/>
      <path d="M140 88c12-21 28-31 47-29l-14 21c-10 5-20 8-33 8z" transform="rotate(300 140 88)"/>
      <circle cx="140" cy="88" r="14" fill="#141419"/>
    </g>
  </defs>

  <rect width="1254" height="1254" fill="url(#board)"/>
  <rect width="1254" height="1254" fill="url(#scan)"/>
  <text x="627" y="42" class="label" font-size="18">NEO-ORGANIC SYMBOL BADGES · B6.1</text>
  <text x="627" y="69" class="meta" font-size="14">原创正负形 · 旋转秩序 · 有机曲面 · 雾白 bloom · 统一安全区与里程碑数字</text>

  <g fill="#fff" fill-opacity=".014" stroke="#fff" stroke-opacity=".075">
    <rect x="12" y="92" width="296" height="522" rx="28"/><rect x="323" y="92" width="296" height="522" rx="28"/><rect x="634" y="92" width="296" height="522" rx="28"/><rect x="945" y="92" width="296" height="522" rx="28"/>
    <rect x="12" y="632" width="296" height="598" rx="28"/><rect x="323" y="632" width="296" height="598" rx="28"/><rect x="634" y="632" width="296" height="598" rx="28"/><rect x="945" y="632" width="296" height="598" rx="28"/>
  </g>

  <g transform="translate(30 130)" filter="url(#cardShadow)"><rect x="28" y="12" width="224" height="252" rx="72" fill="url(#well)" stroke="url(#frame)" stroke-width="7"/><rect x="43" y="27" width="194" height="222" rx="59" fill="none" stroke="#77747c" stroke-opacity=".45" stroke-width="2"/><g class="glyph"><use href="#pulseGlyph"/></g><text x="140" y="190" class="token">100K</text></g>
  <text x="160" y="456" class="label" font-size="18">PULSE ARCHIVE</text><text x="160" y="484" class="meta" font-size="15">累计操作 · 100,000 次</text><text x="160" y="548" class="label" font-size="13">SINGULARITY</text>

  <g transform="translate(341 130)" filter="url(#cardShadow)"><rect x="28" y="12" width="224" height="252" rx="72" fill="url(#well)" stroke="url(#frame)" stroke-width="7"/><rect x="43" y="27" width="194" height="222" rx="59" fill="none" stroke="#77747c" stroke-opacity=".45" stroke-width="2"/><g class="glyph"><use href="#comboGlyph"/></g><text x="140" y="190" class="token">×50</text></g>
  <text x="471" y="456" class="label" font-size="18">CHAIN REACTOR</text><text x="471" y="484" class="meta" font-size="15">最高 Combo · 50</text><text x="471" y="548" class="label" font-size="13">SINGULARITY</text>

  <g transform="translate(652 130)" filter="url(#cardShadow)"><rect x="28" y="12" width="224" height="252" rx="72" fill="url(#well)" stroke="url(#frame)" stroke-width="7"/><rect x="43" y="27" width="194" height="222" rx="59" fill="none" stroke="#77747c" stroke-opacity=".45" stroke-width="2"/><g class="glyph"><use href="#speedGlyph"/></g><text x="140" y="190" class="token">3.5</text><text x="140" y="218" class="unit">KM/H</text></g>
  <text x="782" y="456" class="label" font-size="18">REDLINE</text><text x="782" y="484" class="meta" font-size="15">动力里程碑 · 3.5 km/h</text><text x="782" y="548" class="label" font-size="13">APEX</text>

  <g transform="translate(963 130)" filter="url(#cardShadow)"><rect x="28" y="12" width="224" height="252" rx="72" fill="url(#well)" stroke="url(#frame)" stroke-width="7"/><rect x="43" y="27" width="194" height="222" rx="59" fill="none" stroke="#77747c" stroke-opacity=".45" stroke-width="2"/><g class="glyph"><use href="#focusGlyph"/></g><text x="140" y="190" class="token">10h</text></g>
  <text x="1093" y="456" class="label" font-size="18">STEADY FIELD</text><text x="1093" y="484" class="meta" font-size="15">真实触摸 · 10 小时</text><text x="1093" y="548" class="label" font-size="13">SINGULARITY</text>

  <g transform="translate(30 690)" filter="url(#cardShadow)"><rect x="28" y="12" width="224" height="252" rx="72" fill="url(#well)" stroke="url(#frame)" stroke-width="7"/><rect x="43" y="27" width="194" height="222" rx="59" fill="none" stroke="#77747c" stroke-opacity=".45" stroke-width="2"/><g class="glyph"><use href="#perfectGlyph"/></g><text x="140" y="203" class="wordToken">PERFECT</text></g>
  <text x="160" y="1016" class="label" font-size="18">PERFECT CONTROL</text><text x="160" y="1044" class="meta" font-size="15">技巧 · Perfect Spin / Slide / Fan</text><text x="160" y="1108" class="label" font-size="13">HIDDEN · SINGULARITY</text>

  <g transform="translate(341 690)" filter="url(#cardShadow)"><circle cx="140" cy="138" r="112" fill="url(#well)" stroke="url(#frame)" stroke-width="7"/><circle cx="140" cy="138" r="94" fill="none" stroke="#77747c" stroke-opacity=".45" stroke-width="2"/><g class="glyph"><use href="#rhythmGlyph"/></g><text x="140" y="190" class="token">12W</text></g>
  <text x="471" y="1016" class="label" font-size="18">RHYTHM CORE</text><text x="471" y="1044" class="meta" font-size="15">收藏者节奏 · 12 个有效周</text><text x="471" y="1108" class="label" font-size="13">SINGULARITY</text>

  <g transform="translate(652 690)" filter="url(#cardShadow)"><circle cx="140" cy="138" r="112" fill="url(#well)" stroke="url(#frame)" stroke-width="7"/><circle cx="140" cy="138" r="94" fill="none" stroke="#77747c" stroke-opacity=".45" stroke-width="2"/><g class="glyph"><use href="#masteryGlyph"/></g><text x="140" y="190" class="token">100</text><text x="140" y="218" class="unit">LV</text></g>
  <text x="782" y="1016" class="label" font-size="18">MASTER CORE</text><text x="782" y="1044" class="meta" font-size="15">精通 · 玩具达到 LV.100</text><text x="782" y="1108" class="label" font-size="13">SINGULARITY</text>

  <g transform="translate(963 690)" filter="url(#cardShadow)"><circle cx="140" cy="138" r="112" fill="url(#well)" stroke="url(#frame)" stroke-width="7"/><circle cx="140" cy="138" r="94" fill="none" stroke="#77747c" stroke-opacity=".45" stroke-width="2"/><g class="glyphWarm"><use href="#collectionGlyph"/></g><text x="140" y="190" class="token">25</text></g>
  <text x="1093" y="1016" class="label" font-size="18">VAULT INDEX</text><text x="1093" y="1044" class="meta" font-size="15">外观收藏 · 25 件</text><text x="1093" y="1108" class="label" font-size="13">SINGULARITY</text>

  <text x="627" y="1190" class="meta" font-size="14">符号编码成就语义；数字仍是里程碑主视觉，不因风格切换而消失</text>
</svg>
