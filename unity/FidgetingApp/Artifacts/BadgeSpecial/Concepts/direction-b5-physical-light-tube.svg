<svg xmlns="http://www.w3.org/2000/svg" width="1254" height="1254" viewBox="0 0 1254 1254">
  <defs>
    <style>
      @font-face { font-family: Oxanium; src: url('../../../Assets/Plugins/iOS/Fonts/Oxanium-VariableFont_wght.ttf'); }
      .token { font-family: Oxanium, -apple-system, sans-serif; font-size: 58px; font-weight: 720; text-anchor: middle; fill: #f8f5ff; }
      .wordToken { font-family: Oxanium, -apple-system, sans-serif; font-size: 38px; font-weight: 720; text-anchor: middle; fill: #f8f5ff; }
      .unit { font-family: Oxanium, -apple-system, sans-serif; font-size: 18px; font-weight: 650; text-anchor: middle; fill: #a9a4b8; }
      .label { font-family: Oxanium, -apple-system, sans-serif; font-weight: 680; text-anchor: middle; fill: #f5f2fb; }
      .meta { font-family: -apple-system, sans-serif; font-weight: 500; text-anchor: middle; fill: #9994a6; }
      .tubeGlow, .tubeEdge, .tubeBody, .tubeHighlight { fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .tubeGlow { stroke-width: 22; opacity: .13; filter: url(#glow); }
      .tubeEdge { stroke: #17131e; stroke-width: 18; opacity: .54; transform: translate(0px, 2.2px); }
      .tubeBody { stroke-width: 14; }
      .tubeHighlight { stroke: #f5edff; stroke-width: 4; opacity: .2; transform: translate(-2.6px, -2.6px); filter: url(#softHighlight); }
      .violet .tubeGlow { stroke: #9f78df; } .violet .tubeBody { stroke: url(#mistViolet); }
      .cyan .tubeGlow { stroke: #79b6d2; } .cyan .tubeBody { stroke: url(#mistBlue); }
      .gold .tubeGlow { stroke: #c6a670; } .gold .tubeBody { stroke: url(#mistGold); }
    </style>
