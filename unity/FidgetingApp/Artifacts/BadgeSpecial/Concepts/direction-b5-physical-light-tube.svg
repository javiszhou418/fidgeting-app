    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8f6ff"/><stop offset=".3" stop-color="#898596"/><stop offset=".55" stop-color="#464451"/><stop offset=".82" stop-color="#d8d4e1"/><stop offset="1" stop-color="#777382"/></linearGradient>
