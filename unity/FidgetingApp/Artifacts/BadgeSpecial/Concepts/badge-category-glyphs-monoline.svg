  <text x="627" y="76" class="meta" font-size="15" fill="#898596">同一线宽 · 同一圆头 · 最多两个几何关系 · 无装饰碎片</text>

  <g fill="#fff" fill-opacity=".018" stroke="#fff" stroke-opacity=".08">
    <rect x="24" y="108" width="224" height="308" rx="28"/><rect x="270" y="108" width="224" height="308" rx="28"/><rect x="516" y="108" width="224" height="308" rx="28"/><rect x="762" y="108" width="224" height="308" rx="28"/><rect x="1008" y="108" width="224" height="308" rx="28"/>
    <rect x="24" y="442" width="224" height="308" rx="28"/><rect x="270" y="442" width="224" height="308" rx="28"/><rect x="516" y="442" width="224" height="308" rx="28"/><rect x="762" y="442" width="224" height="308" rx="28"/><rect x="1008" y="442" width="224" height="308" rx="28"/>
  </g>

