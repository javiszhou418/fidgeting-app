<svg xmlns="http://www.w3.org/2000/svg" width="1254" height="1254" viewBox="0 0 1254 1254">
  <defs>
    <style>
      @font-face { font-family: Oxanium; src: url('../../../Assets/Plugins/iOS/Fonts/Oxanium-VariableFont_wght.ttf'); }
      .title { font-family: Oxanium, -apple-system, sans-serif; font-weight: 700; text-anchor: middle; }
      .meta { font-family: -apple-system, sans-serif; font-weight: 500; text-anchor: middle; }
      .icon { fill: none; stroke-width: 10; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7f62ff"/><stop offset=".5" stop-color="#c38aff"/><stop offset="1" stop-color="#6a55e8"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#92f5ff"/><stop offset="1" stop-color="#5288ff"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff2c8"/><stop offset="1" stop-color="#d6a75c"/></linearGradient>
    <radialGradient id="core"><stop stop-color="#8d5cff" stop-opacity=".23"/><stop offset="1" stop-color="#14141f" stop-opacity=".96"/></radialGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".55"/></filter>
  </defs>
  <rect width="1254" height="1254" fill="#0b0c13"/>
  <g transform="translate(0 217)">
