<svg xmlns="http://www.w3.org/2000/svg" width="1254" height="1254" viewBox="0 0 1254 1254">
  <defs>
    <style>
      @font-face { font-family: Oxanium; src: url('../../../Assets/Plugins/iOS/Fonts/Oxanium-VariableFont_wght.ttf'); }
      .display { font-family: Oxanium, -apple-system, sans-serif; font-weight: 720; text-anchor: middle; }
      .token { font-family: Oxanium, -apple-system, sans-serif; font-weight: 720; font-size: 70px; text-anchor: middle; }
      .unit { font-family: Oxanium, -apple-system, sans-serif; font-weight: 650; font-size: 18px; text-anchor: middle; letter-spacing: .5px; }
      .label { font-family: Oxanium, -apple-system, sans-serif; font-weight: 650; text-anchor: middle; letter-spacing: .7px; }
      .meta { font-family: -apple-system, sans-serif; font-weight: 500; text-anchor: middle; }
      .hair { fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .icon { fill: none; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <linearGradient id="board" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090a10"/>
      <stop offset="1" stop-color="#11111b"/>
    </linearGradient>
    <linearGradient id="titanium" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fcfbff"/>
      <stop offset=".26" stop-color="#aaa6bb"/>
      <stop offset=".55" stop-color="#5c596c"/>
      <stop offset=".78" stop-color="#dedbe8"/>
      <stop offset="1" stop-color="#777487"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset=".52" stop-color="#c78cff"/>
      <stop offset="1" stop-color="#6342d8"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8df6ff"/>
      <stop offset="1" stop-color="#3a8cff"/>
    </linearGradient>
    <linearGradient id="champagne" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff7df"/>
      <stop offset="1" stop-color="#d7a75d"/>
    </linearGradient>
    <radialGradient id="coreViolet">
      <stop offset="0" stop-color="#a36cff" stop-opacity=".28"/>
      <stop offset=".7" stop-color="#422b75" stop-opacity=".13"/>
      <stop offset="1" stop-color="#151522" stop-opacity=".94"/>
    </radialGradient>
    <radialGradient id="coreBlue">
      <stop offset="0" stop-color="#68ddff" stop-opacity=".24"/>
      <stop offset=".72" stop-color="#203f67" stop-opacity=".12"/>
      <stop offset="1" stop-color="#141620" stop-opacity=".95"/>
    </radialGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="15" stdDeviation="16" flood-color="#000" flood-opacity=".6"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1254" height="1254" fill="url(#board)"/>
  <text x="627" y="42" class="label" font-size="17" fill="#f2effa">REAL ACHIEVEMENTS · LIGHTWEIGHT SYSTEM</text>
  <text x="627" y="68" class="meta" font-size="14" fill="#8d899b">一个类别锚点 + 一个主数字 / 主图形 · 其余信息由卡片承载</text>

  <!-- card backgrounds -->
  <g fill="#ffffff" fill-opacity=".018" stroke="#ffffff" stroke-opacity=".09">
    <rect x="12" y="92" width="296" height="522" rx="28"/>
    <rect x="323" y="92" width="296" height="522" rx="28"/>
    <rect x="634" y="92" width="296" height="522" rx="28"/>
    <rect x="945" y="92" width="296" height="522" rx="28"/>
    <rect x="12" y="632" width="296" height="598" rx="28"/>
    <rect x="323" y="632" width="296" height="598" rx="28"/>
    <rect x="634" y="632" width="296" height="598" rx="28"/>
    <rect x="945" y="632" width="296" height="598" rx="28"/>
  </g>

  <!-- 1: lifetime gestures 100K -->
  <g transform="translate(30 130)" filter="url(#shadow)">
    <rect x="28" y="12" width="224" height="252" rx="72" fill="url(#coreViolet)" stroke="url(#titanium)" stroke-width="9"/>
    <rect x="43" y="27" width="194" height="222" rx="60" class="hair" stroke="#a68cff" stroke-opacity=".48" stroke-width="2"/>
    <path d="M101 75c17-17 41-17 58 0m-74 18c27-28 66-28 93 0" class="icon" stroke="url(#violet)"/>
    <text x="140" y="184" class="token" fill="#f7f3ff">100K</text>
    <path d="M102 203h76" class="hair" stroke="#b98aff" stroke-width="7"/>
  </g>
  <text x="160" y="456" class="label" font-size="18" fill="#f5f1ff">PULSE ARCHIVE</text>
  <text x="160" y="484" class="meta" font-size="15" fill="#a9a4b5">累计操作 · 100,000 次</text>
  <text x="160" y="548" class="display" font-size="14" fill="#8a789f">SINGULARITY</text>

  <!-- 2: combo 50 -->
  <g transform="translate(341 130)" filter="url(#shadow)">
    <rect x="28" y="12" width="224" height="252" rx="72" fill="url(#coreViolet)" stroke="url(#titanium)" stroke-width="9"/>
    <rect x="43" y="27" width="194" height="222" rx="60" class="hair" stroke="#b56cff" stroke-opacity=".5" stroke-width="2"/>
    <g transform="translate(98 61) rotate(-26 42 22)" class="icon" stroke="url(#violet)">
      <rect x="0" y="1" width="54" height="36" rx="18"/><rect x="32" y="9" width="54" height="36" rx="18"/>
    </g>
    <text x="140" y="184" class="token" fill="#f8f4ff">×50</text>
  </g>
  <text x="471" y="456" class="label" font-size="18" fill="#f5f1ff">CHAIN REACTOR</text>
  <text x="471" y="484" class="meta" font-size="15" fill="#a9a4b5">最高 Combo · 50</text>
  <text x="471" y="548" class="display" font-size="14" fill="#8a789f">SINGULARITY</text>

  <!-- 3: speed 3.5 -->
  <g transform="translate(652 130)" filter="url(#shadow)">
    <rect x="28" y="12" width="224" height="252" rx="72" fill="url(#coreBlue)" stroke="url(#titanium)" stroke-width="9"/>
    <rect x="43" y="27" width="194" height="222" rx="60" class="hair" stroke="#69cfff" stroke-opacity=".46" stroke-width="2"/>
    <path d="M86 88h72l-21-20m21 20-21 20" class="icon" stroke="url(#cyan)"/>
    <text x="140" y="184" class="token" fill="#f3fbff">3.5</text>
    <text x="140" y="215" class="unit" fill="#8fdfff">KM/H</text>
  </g>
  <text x="782" y="456" class="label" font-size="18" fill="#f5f1ff">REDLINE</text>
  <text x="782" y="484" class="meta" font-size="15" fill="#a9a4b5">动力里程碑 · 3.5 km/h</text>
  <text x="782" y="548" class="display" font-size="14" fill="#638fac">APEX</text>

  <!-- 4: focus 10h -->
  <g transform="translate(963 130)" filter="url(#shadow)">
    <rect x="28" y="12" width="224" height="252" rx="72" fill="url(#coreBlue)" stroke="url(#titanium)" stroke-width="9"/>
    <rect x="43" y="27" width="194" height="222" rx="60" class="hair" stroke="#7db8ff" stroke-opacity=".44" stroke-width="2"/>
    <path d="M119 75a29 29 0 1 1-5 37m52 5a29 29 0 0 1-4 5" class="icon" stroke="url(#cyan)"/>
    <circle cx="140" cy="96" r="7" class="icon" stroke="url(#cyan)"/>
    <text x="140" y="184" class="token" fill="#f5fbff">10h</text>
  </g>
  <text x="1093" y="456" class="label" font-size="18" fill="#f5f1ff">STEADY FIELD</text>
  <text x="1093" y="484" class="meta" font-size="15" fill="#a9a4b5">真实触摸 · 10 小时</text>
  <text x="1093" y="548" class="display" font-size="14" fill="#638fac">SINGULARITY</text>

  <!-- 5: perfect technique; no numeric milestone -->
  <g transform="translate(30 690)" filter="url(#shadow)">
    <rect x="28" y="12" width="224" height="252" rx="72" fill="url(#coreViolet)" stroke="url(#titanium)" stroke-width="9"/>
    <rect x="43" y="27" width="194" height="222" rx="60" class="hair" stroke="#c18cff" stroke-opacity=".44" stroke-width="2"/>
    <circle cx="140" cy="137" r="66" fill="none" stroke="#8a70b5" stroke-opacity=".55" stroke-width="3"/>
    <path d="M140 64l24 49 50 24-50 24-24 49-24-49-50-24 50-24z" class="icon" stroke="url(#violet)"/>
    <circle cx="140" cy="137" r="12" class="icon" stroke="#f5efff" filter="url(#glow)"/>
  </g>
  <text x="160" y="1016" class="label" font-size="18" fill="#f5f1ff">PERFECT CONTROL</text>
  <text x="160" y="1044" class="meta" font-size="15" fill="#a9a4b5">技巧 · Perfect Spin / Slide / Fan</text>
  <text x="160" y="1108" class="display" font-size="14" fill="#8a789f">HIDDEN · SINGULARITY</text>

  <!-- 6: rhythm 12 weeks -->
  <g transform="translate(341 690)" filter="url(#shadow)">
    <circle cx="140" cy="138" r="112" fill="url(#coreViolet)" stroke="url(#titanium)" stroke-width="9"/>
    <circle cx="140" cy="138" r="94" class="hair" stroke="#bd8cff" stroke-opacity=".45" stroke-width="2"/>
    <path d="M73 91h25l12-21 19 44 18-37 14 14h42" class="icon" stroke="url(#violet)"/>
    <text x="140" y="184" class="token" fill="#f8f4ff">12W</text>
  </g>
  <text x="471" y="1016" class="label" font-size="18" fill="#f5f1ff">RHYTHM CORE</text>
  <text x="471" y="1044" class="meta" font-size="15" fill="#a9a4b5">收藏者节奏 · 12 个有效周</text>
  <text x="471" y="1108" class="display" font-size="14" fill="#8a789f">SINGULARITY</text>

  <!-- 7: level 100 mastery -->
  <g transform="translate(652 690)" filter="url(#shadow)">
    <circle cx="140" cy="138" r="112" fill="url(#coreViolet)" stroke="url(#titanium)" stroke-width="9"/>
    <circle cx="140" cy="138" r="94" class="hair" stroke="#d5b3ff" stroke-opacity=".45" stroke-width="2"/>
    <path d="M140 59l27 16v31l-27 16-27-16V75z" class="icon" stroke="url(#violet)"/>
    <text x="140" y="184" class="token" fill="#f8f4ff">100</text>
    <text x="140" y="215" class="unit" fill="#bda6da">LV</text>
  </g>
  <text x="782" y="1016" class="label" font-size="18" fill="#f5f1ff">MASTER CORE</text>
  <text x="782" y="1044" class="meta" font-size="15" fill="#a9a4b5">精通 · 玩具达到 LV.100</text>
  <text x="782" y="1108" class="display" font-size="14" fill="#8a789f">SINGULARITY</text>

  <!-- 8: cosmetics 25 -->
  <g transform="translate(963 690)" filter="url(#shadow)">
    <circle cx="140" cy="138" r="112" fill="url(#coreViolet)" stroke="url(#champagne)" stroke-width="9"/>
    <circle cx="140" cy="138" r="94" class="hair" stroke="#e6c990" stroke-opacity=".5" stroke-width="2"/>
    <g class="icon" stroke="url(#champagne)">
      <rect x="100" y="63" width="44" height="44" rx="12"/><rect x="136" y="75" width="44" height="44" rx="12"/>
    </g>
    <text x="140" y="184" class="token" fill="#fff9e8">25</text>
  </g>
  <text x="1093" y="1016" class="label" font-size="18" fill="#f5f1ff">VAULT INDEX</text>
  <text x="1093" y="1044" class="meta" font-size="15" fill="#a9a4b5">外观收藏 · 25 件</text>
  <text x="1093" y="1108" class="display" font-size="14" fill="#b99860">SINGULARITY</text>

  <text x="627" y="1190" class="meta" font-size="14" fill="#757181">数字由运行时排版，不写进底图；框架编码 scope / grade，符号编码 category</text>
</svg>
