<svg xmlns="http://www.w3.org/2000/svg" width="1254" height="1254" viewBox="0 0 1254 1254">
  <defs>
    <style>
      @font-face { font-family: Oxanium; src: url('../../../Assets/Plugins/iOS/Fonts/Oxanium-VariableFont_wght.ttf'); }
      .heading { font-family: Oxanium, -apple-system, sans-serif; font-weight: 700; text-anchor: middle; fill: #edf1f3; }
      .token { font-family: Oxanium, -apple-system, sans-serif; font-size: 38px; font-weight: 720; text-anchor: middle; fill: #f4f6f7; }
      .tokenUnit { font-size: 12px; font-weight: 650; letter-spacing: .6px; fill: #aab2b8; }
      .title { font-family: Oxanium, -apple-system, sans-serif; font-size: 14px; font-weight: 680; letter-spacing: 1.1px; text-anchor: middle; fill: #cbd1d5; }
    </style>
    <linearGradient id="board" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#07090b"/><stop offset="1" stop-color="#101319"/></linearGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><path d="M0 1.5h4" stroke="#fff" stroke-opacity=".014" stroke-width="1"/></pattern>
    <pattern id="leather" width="26" height="24" patternUnits="userSpaceOnUse">
      <rect width="26" height="24" fill="#101216"/>
      <path d="M1 6c3-3 8-4 11-1 3 2 7 2 11-1M4 18c3-3 8-3 11 0 3 2 6 2 10-1M15 0c-1 3 0 6 3 8" fill="none" stroke="#3a3f46" stroke-opacity=".11" stroke-width=".9"/>
      <circle cx="6" cy="12" r="1.1" fill="#454b52" fill-opacity=".11"/><circle cx="20" cy="10" r=".8" fill="#000" fill-opacity=".24"/><circle cx="17" cy="22" r="1" fill="#454b52" fill-opacity=".09"/><circle cx="2" cy="23" r=".7" fill="#000" fill-opacity=".22"/>
    </pattern>
    <linearGradient id="chromeRim" gradientUnits="userSpaceOnUse" x1="20" y1="10" x2="250" y2="470"><stop stop-color="#f4f6f7"/><stop offset=".18" stop-color="#aeb4b8"/><stop offset=".42" stop-color="#353a3f"/><stop offset=".62" stop-color="#d6dadd"/><stop offset=".82" stop-color="#626970"/><stop offset="1" stop-color="#eef1f2"/></linearGradient>
    <filter id="shellShadow" x="-35%" y="-20%" width="170%" height="160%"><feDropShadow dx="0" dy="13" stdDeviation="13" flood-color="#000" flood-opacity=".7"/></filter>
    <filter id="singularityBloom" x="-45%" y="-30%" width="190%" height="180%"><feGaussianBlur in="SourceAlpha" stdDeviation="5" result="b"/><feFlood flood-color="#d9eaff" flood-opacity=".17" result="c"/><feComposite in="c" in2="b" operator="in" result="h"/><feMerge><feMergeNode in="h"/><feMergeNode in="SourceGraphic"/></feMerge></filter>

    <rect id="shapeIgnition" x="18" y="10" width="250" height="320" rx="56"/>
    <rect id="shapeOverdrive" x="18" y="10" width="250" height="320" rx="125"/>
    <path id="shapeApex" d="M143 10C214 10 254 28 268 56v156c0 51-45 88-125 118C63 300 18 263 18 212V56C32 28 72 10 143 10z"/>
    <path id="shapeSingularity" d="M143 10C218 10 257 29 268 62v140c0 56-42 97-125 128C60 299 18 258 18 202V62C29 29 68 10 143 10z"/>

    <clipPath id="clipIgnition"><use href="#shapeIgnition"/></clipPath>
    <clipPath id="clipOverdrive"><use href="#shapeOverdrive"/></clipPath>
    <clipPath id="clipApex"><use href="#shapeApex"/></clipPath>
    <clipPath id="clipSingularity"><use href="#shapeSingularity"/></clipPath>
  </defs>

  <rect width="1254" height="1254" fill="url(#board)"/><rect width="1254" height="1254" fill="url(#scan)"/>
  <text x="627" y="38" class="heading" font-size="17">B8 · COMPACT RARITY BADGES</text>

  <!-- Shared layout: shell local size 286 × 340; icon viewport 156 × 156 centered at (143,117); only two text baselines at y=226 and y=260. Each raster cell has an optical-center viewBox correction. -->

  <!-- 1 / IGNITION / PULSE 100 -->
  <g transform="translate(13 92) scale(.97)" filter="url(#shellShadow)">
    <use href="#shapeIgnition" fill="url(#leather)" stroke="url(#chromeRim)" stroke-width="6"/>
    <g clip-path="url(#clipIgnition)">
      <svg x="65" y="39" width="156" height="156" viewBox="21 35 418 418" style="mix-blend-mode:screen"><image href="direction-b8-diffuse-chrome-symbols.png" width="1254" height="1254"/></svg>
      <text x="143" y="226" class="token">100</text>
      <text x="143" y="260" class="title">PULSE</text>
    </g>
  </g>

  <!-- 2 / OVERDRIVE / COMBO 10 -->
  <g transform="translate(324 92) scale(.97)" filter="url(#shellShadow)">
    <use href="#shapeOverdrive" fill="url(#leather)" stroke="url(#chromeRim)" stroke-width="7"/>
    <use href="#shapeOverdrive" fill="none" stroke="#7d878e" stroke-opacity=".64" stroke-width="2" transform="translate(9 13) scale(.937 .946)"/>
    <g clip-path="url(#clipOverdrive)">
      <svg x="65" y="39" width="156" height="156" viewBox="415 38 418 418" style="mix-blend-mode:screen"><image href="direction-b8-diffuse-chrome-symbols.png" width="1254" height="1254"/></svg>
      <text x="143" y="226" class="token">×10</text>
      <text x="143" y="260" class="title">CHAIN</text>
    </g>
  </g>

  <!-- 3 / APEX / REDLINE -->
  <g transform="translate(635 92) scale(.97)" filter="url(#shellShadow)">
    <use href="#shapeApex" fill="url(#leather)" stroke="url(#chromeRim)" stroke-width="8"/>
    <use href="#shapeApex" fill="none" stroke="#9ca9b0" stroke-opacity=".62" stroke-width="2" transform="translate(9 13) scale(.937 .946)"/>
    <g clip-path="url(#clipApex)">
      <svg x="65" y="39" width="156" height="156" viewBox="805 24 418 418" style="mix-blend-mode:screen"><image href="direction-b8-diffuse-chrome-symbols.png" width="1254" height="1254"/></svg>
      <text x="143" y="226" class="token">3.5<tspan class="tokenUnit" dx="6">KM/H</tspan></text>
      <text x="143" y="260" class="title">REDLINE</text>
    </g>
  </g>

  <!-- 4 / SINGULARITY / FOCUS -->
  <g transform="translate(946 92) scale(.97)" filter="url(#shellShadow)">
    <g filter="url(#singularityBloom)"><use href="#shapeSingularity" fill="url(#leather)" stroke="url(#chromeRim)" stroke-width="8"/></g>
    <use href="#shapeSingularity" fill="none" stroke="#b6c4cc" stroke-opacity=".72" stroke-width="2.4" transform="translate(9 13) scale(.937 .946)"/>
    <g clip-path="url(#clipSingularity)">
      <svg x="65" y="39" width="156" height="156" viewBox="19 402 418 418" style="mix-blend-mode:screen"><image href="direction-b8-diffuse-chrome-symbols.png" width="1254" height="1254"/></svg>
      <text x="143" y="226" class="token">10H</text>
      <text x="143" y="260" class="title">FOCUS</text>
    </g>
  </g>

  <!-- 5 / SINGULARITY / PERFECT -->
  <g transform="translate(13 650) scale(.97)" filter="url(#shellShadow)">
    <g filter="url(#singularityBloom)"><use href="#shapeSingularity" fill="url(#leather)" stroke="url(#chromeRim)" stroke-width="8"/></g>
    <use href="#shapeSingularity" fill="none" stroke="#b6c4cc" stroke-opacity=".72" stroke-width="2.4" transform="translate(9 13) scale(.937 .946)"/>
    <g clip-path="url(#clipSingularity)">
      <svg x="65" y="39" width="156" height="156" viewBox="412 398 418 418" style="mix-blend-mode:screen"><image href="direction-b8-diffuse-chrome-symbols.png" width="1254" height="1254"/></svg>
      <text x="143" y="226" class="token">PERFECT</text>
      <text x="143" y="260" class="title">CONTROL</text>
    </g>
  </g>

  <!-- 6 / OVERDRIVE / RHYTHM -->
  <g transform="translate(324 650) scale(.97)" filter="url(#shellShadow)">
    <use href="#shapeOverdrive" fill="url(#leather)" stroke="url(#chromeRim)" stroke-width="7"/>
    <use href="#shapeOverdrive" fill="none" stroke="#7d878e" stroke-opacity=".64" stroke-width="2" transform="translate(9 13) scale(.937 .946)"/>
    <g clip-path="url(#clipOverdrive)">
      <svg x="65" y="39" width="156" height="156" viewBox="812 403 418 418" style="mix-blend-mode:screen"><image href="direction-b8-diffuse-chrome-symbols.png" width="1254" height="1254"/></svg>
      <text x="143" y="226" class="token">4W</text>
      <text x="143" y="260" class="title">RHYTHM</text>
    </g>
  </g>

  <!-- 7 / IGNITION / MASTERY -->
  <g transform="translate(635 650) scale(.97)" filter="url(#shellShadow)">
    <use href="#shapeIgnition" fill="url(#leather)" stroke="url(#chromeRim)" stroke-width="6"/>
    <g clip-path="url(#clipIgnition)">
      <svg x="65" y="39" width="156" height="156" viewBox="13 778 418 418" style="mix-blend-mode:screen"><image href="direction-b8-diffuse-chrome-symbols.png" width="1254" height="1254"/></svg>
      <text x="143" y="226" class="token">LV 20</text>
      <text x="143" y="260" class="title">MASTERY</text>
    </g>
  </g>

  <!-- 8 / SINGULARITY / COLLECTION -->
  <g transform="translate(946 650) scale(.97)" filter="url(#shellShadow)">
    <g filter="url(#singularityBloom)"><use href="#shapeSingularity" fill="url(#leather)" stroke="url(#chromeRim)" stroke-width="8"/></g>
    <use href="#shapeSingularity" fill="none" stroke="#b6c4cc" stroke-opacity=".72" stroke-width="2.4" transform="translate(9 13) scale(.937 .946)"/>
    <g clip-path="url(#clipSingularity)">
      <svg x="65" y="39" width="156" height="156" viewBox="408 772 418 418" style="mix-blend-mode:screen"><image href="direction-b8-diffuse-chrome-symbols.png" width="1254" height="1254"/></svg>
      <text x="143" y="226" class="token">25</text>
      <text x="143" y="260" class="title">VAULT</text>
    </g>
  </g>

</svg>
